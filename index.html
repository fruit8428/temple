const parseChineseNumber = s => {

    '壹': 1,
    '1': 1,
    '二': 2,
    '貳': 2,
    '两': 2,

    '七': 7,
    '柒': 7,
    '7': 7,
    '八': 8,
    '捌': 8,
    '8': 8,
    '九': 9,
    '玖': 9,
    '9': 9
  };

  let posDigits = "";

    if (digitMap[ch] !== undefined) {

    return parseInt(posDigits, 10);
  }
  let total = 0;
  let temp = 0;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (digitMap[ch] !== undefined) {
      temp = digitMap[ch];
    } else if (ch === '十' || ch === '拾') {
      if (temp === 0) temp = 1;
      total += temp * 10;
      temp = 0;
    } else if (ch === '百' || ch === '佰') {
      if (temp === 0) temp = 1;
      total += temp * 100;
      temp = 0;
    } else if (ch === '千' || ch === '仟') {

    }
  }
  total += temp;
  return total;
};

const standardizeLunarBirthday = raw => {

  let d = parseChineseNumber(dayPart);

  } else {

  if (m > 0) {
    m = Math.min(12, Math.max(1, m));

      d = Math.min(31, Math.max(1, d));
